# TEMPLATE FILE — but this one is NOT written per-site; it is a
# single, static (non-substituted) file committed once at repo setup
# time and never regenerated by Meta-Site. GitHub Pages serves exactly
# one site per repo, so every static-tier Custom Site is published as
# a subdirectory of that one shared Pages deployment rather than each
# getting its own Pages site. This workflow's only job is: take
# whatever currently exists under custom-sites/ in this (public) repo
# and publish all of it as the Pages artifact, unchanged. Meta-Site
# writes/deletes each site's folder at custom-sites/<name>/ via the
# Contents API, then dispatches this same shared workflow to
# re-publish. A published static site's URL is therefore
# https://<owner>.github.io/<repo>/custom-sites/<name>/.
#
# Un-publishing a static site deletes its custom-sites/<name>/ folder
# from the public repo, then dispatches this workflow again so the
# Pages artifact is rebuilt without it. See
# lib/sites/staticSiteLifecycle.ts.

name: Pages - Custom Sites

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-custom-sites
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout public repo
        uses: actions/checkout@v4

      - name: Prepare Pages root
        run: |
          mkdir -p /tmp/pages-root/custom-sites
          if [ -d custom-sites ]; then
            cp -r custom-sites/. /tmp/pages-root/custom-sites/
          fi
          echo "Published sites: $(ls -1 /tmp/pages-root/custom-sites 2>/dev/null | wc -l)"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/pages-root

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
