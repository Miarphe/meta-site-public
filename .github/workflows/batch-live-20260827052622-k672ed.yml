# TEMPLATE FILE — NOT a real, runnable workflow on its own.
# See bot-template.yml for the full substitution-scheme explanation;
# it applies identically here.
#
# This is the SHARED workflow shape for a batch of up to 15 Live Bot
# or Custom Bot/Site processes running together on one VM (per the
# FLEET-BATCHING ARCHITECTURE section — three separate, independent
# pools: Live Bot batches, Custom Bot/Site batches, and dedicated WFO
# bots, never cross-filled). Meta-Site writes the substituted result
# to .github/workflows/batch-live-20260827052622-k672ed.yml.
#
# Tokens used in this template:
#   live-20260827052622-k672ed          — the batch's unique ID
#   miadol — the private repo name
#
# members.json (private-repo, at
# freqtrade-core/user_data/batches/live-20260827052622-k672ed/members.json) is the
# single source of truth for batch membership, written by Meta-Site
# whenever a bot is placed into or removed from this batch. This
# workflow reads it fresh on every run so a bot added between runs is
# picked up on the batch's next dispatch without any template
# resubstitution. Each member entry carries its own bot_name,
# bot_dir (private-repo-relative), strategy_class, and a
# max_mem_mb figure used for the soft guardrail below.
#
# Pass 18 gave every member process its own independent
# budget-exhaustion self-restart (mirroring the single-bot pattern,
# scoped per-member rather than per-batch) — there was no shared
# clock and no coordinated whole-batch handoff.
#
# Pass 19 adds the batch-wide shared handoff document at
# freqtrade-core/user_data/batches/live-20260827052622-k672ed/handoff.json and its
# ready_bots sub-check, anchored to batch-formation time (T0, read
# from members.json's created_at) rather than wall-clock. This pass
# ensures the document exists at run start and lets each member
# process mark itself ready in that document as it approaches its own
# budget. It does not yet act on the ready_bots state — no primer
# dispatch, no coordinated go-live. Pass 20 wires the actual
# coordinated prime/go-live/handoff sequencing for all N members on
# top of this document. Until Pass 20 lands, this workflow's only
# continuity mechanism is unchanged from Pass 18: if the whole batch
# job runs past budget, it self-dispatches a fresh batch run, and
# every member process restarts from its own most recent DB snapshot
# inside that fresh run.
#
# Pass 22 makes member launch pool-generic: each member entry also
# carries bot_type ("live" | "custom_bot" | "custom_site") and
# entry_port (null for live). A "live" member launches via the
# Freqtrade CLI exactly as before, against bot_dir under
# user_data/live_bots/<name>. A "custom_bot"/"custom_site" member
# installs its own requirements.txt, exports its credential files
# (bot_token.txt, chat_id.txt, extra_credentials.json, all under
# bot_dir) under every alias in TOKEN_ENV_ALIASES/CHAT_ID_ENV_ALIASES
# (see lib/bots/customBotWrite.ts) plus each extra_credentials.json
# entry under its own literal label, then runs `python3 bot.py` from
# bot_dir with ENTRY_PORT set from entry_port. DB snapshot
# restore/save is skipped for custom members -- they have no
# tradesv3.sqlite; only live members participate in that step.
#
# handoff.json shape (BatchHandoffDocument, see
# lib/batches/batchHandoff.ts in the app for the canonical type):
#   {
#     "batch_id": "...",
#     "t0": "<ISO timestamp, from members.json created_at>",
#     "phase": "idle" | "priming" | "ready" | "go_sent",
#     "primer_instance_id": null,
#     "go_ts": null,
#     "expected_bots": ["bot_a", "bot_b", ...],
#     "ready_bots": [{"bot_name": "bot_a", "ready_at": "<ISO>"}]
#   }

name: Batch - live-20260827052622-k672ed

on:
  workflow_dispatch:
  repository_dispatch:
    types: [restart-batch-live-20260827052622-k672ed, prime-batch-live-20260827052622-k672ed]

concurrency:
  group: ${{ github.event.action == 'prime-batch-live-20260827052622-k672ed' && 'batch-live-20260827052622-k672ed-primer' || 'batch-live-20260827052622-k672ed' }}
  cancel-in-progress: true

jobs:
  run-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
      actions: write
    env:
      META_BOT_GITHUB_PAT: ${{ secrets.META_BOT_GITHUB_PAT }}
      GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
      PRIVATE_REPO: miadol
      BATCH_ID: live-20260827052622-k672ed
      MEMBERS_REPO_PATH: freqtrade-core/user_data/batches/live-20260827052622-k672ed/members.json
      HANDOFF_REPO_PATH: freqtrade-core/user_data/batches/live-20260827052622-k672ed/handoff.json
      HANDOFF_MODE: ${{ github.event.action == 'prime-batch-live-20260827052622-k672ed' && 'primer' || 'normal' }}
      WORKING_DIR: ${{ github.workspace }}/private/freqtrade-core
      MAX_BATCH_MEM_MB: 4096
    steps:
      - name: Print version marker (template)
        run: |
          # Pass 62: moved to be the FIRST step in the job -- see
          # bot-template.yml's own "Print version marker (template)"
          # step for the full rationale (same split: this half needs
          # nothing and runs before checkout; the PRIVATE_REPO_HEAD
          # half stays after clone below, since it needs that first).
          echo "=== batch-template.yml TEMPLATE_VERSION=pass-62 BATCH_ID=live-20260827052622-k672ed ==="

      - name: Checkout public repo
        uses: actions/checkout@v4

      - name: Clone private repo
        run: |
          git clone "https://x-access-token:${META_BOT_GITHUB_PAT}@github.com/${GITHUB_REPOSITORY_OWNER}/${PRIVATE_REPO}.git" private

      - name: Print version marker (private repo HEAD)
        run: |
          # See "Print version marker (template)" above, first step in
          # this job, for the full rationale.
          echo "=== PRIVATE_REPO_HEAD=$(git -C private rev-parse HEAD) (cloned $(date -u +%Y-%m-%dT%H:%M:%SZ)) ==="

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Freqtrade
        run: |
          cd "${WORKING_DIR}"
          python3 -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install freqtrade
          fi
          pip install requests
          # Pass 62: see bot-template.yml's own "Install Freqtrade" step
          # for the full rationale -- same fix here, since batch members
          # share this exact same UI-serving/tunnel setup per-member.
          freqtrade install-ui

      # Pass 52 FOLLOW-UP: this step was missing entirely in the
      # original Pass 52 -- the 'live' member launch loop's tunnel
      # sidecar (see "Launch member processes" below) calls
      # `cloudflared` directly assuming it's already on PATH, exactly
      # like bot-template.yml's own attach step does, but unlike
      # bot-template.yml, batch-template.yml never had a matching
      # Install cloudflared step of its own anywhere in the job.
      # Effect in practice: every batch run's tunnel sidecar subshell
      # failed instantly and silently on `nohup cloudflared tunnel
      # ...` (command not found), the 30s log-scrape wait loop timed
      # out with nothing ever written to CF_LOGFILE, and the sidecar
      # exited via its own "did not report a tunnel URL" ::warning::
      # path -- which explains why grepping the run's own logs for
      # "cloudflare" only ever matched this file's OWN comment text
      # (echoed nowhere in the actual run output) rather than any real
      # cloudflared invocation or error. One shared install here,
      # before the member loop, covers every 'live' member's sidecar
      # in this run -- same "install once per job, not once per bot"
      # reasoning bot-template.yml already applies for its own single
      # bot.
      - name: Install cloudflared
        run: |
          curl -sL --output /tmp/cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i /tmp/cloudflared.deb

      - name: Read members.json
        id: members
        run: |
          MEMBERS_HTTP=$(curl -s -o /tmp/members_resp.json -w "%{http_code}" \
            -H "Authorization: token ${META_BOT_GITHUB_PAT}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY_OWNER}/${PRIVATE_REPO}/contents/${MEMBERS_REPO_PATH}")
          if [ "$MEMBERS_HTTP" != "200" ]; then
            echo "::warning::members.json not found for batch live-20260827052622-k672ed -- nothing to run this cycle."
            echo "member_count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 -c "
          import json, base64
          with open('/tmp/members_resp.json') as f:
              d = json.load(f)
          content = base64.b64decode(d['content'].replace('\n', '')).decode()
          parsed = json.loads(content)
          members = parsed.get('members', [])
          t0 = parsed.get('created_at', '')
          with open('/tmp/members.json', 'w') as out:
              json.dump(members, out)
          with open('/tmp/batch_t0.txt', 'w') as out:
              out.write(t0)
          print(f'member_count={len(members)}')
          " >> "$GITHUB_OUTPUT"

      - name: Ensure batch handoff document
        if: steps.members.outputs.member_count != '0'
        id: handoff_doc
        env:
          HANDOFF_REPO_PATH: freqtrade-core/user_data/batches/live-20260827052622-k672ed/handoff.json
        run: |
          gh_get_handoff_doc() {
            curl -s -H "Authorization: token ${META_BOT_GITHUB_PAT}" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY_OWNER}/${PRIVATE_REPO}/contents/${HANDOFF_REPO_PATH}"
          }

          gh_put_handoff_doc() {
            local content_b64="$1"
            local message="$2"
            for attempt in 1 2 3; do
              sha=$(gh_get_handoff_doc | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get("sha","") if isinstance(d,dict) else "")' 2>/dev/null || echo "")
              if [ -n "$sha" ]; then
                body=$(python3 -c "import json,sys; print(json.dumps({'message': sys.argv[1], 'content': sys.argv[2], 'sha': sys.argv[3]}))" "$message" "$content_b64" "$sha")
              else
                body=$(python3 -c "import json,sys; print(json.dumps({'message': sys.argv[1], 'content': sys.argv[2]}))" "$message" "$content_b64")
              fi
              http_code=$(curl -s -o /tmp/handoff_put_resp.json -w "%{http_code}" \
                -X PUT -H "Authorization: token ${META_BOT_GITHUB_PAT}" \
                -H "Accept: application/vnd.github.v3+json" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY_OWNER}/${PRIVATE_REPO}/contents/${HANDOFF_REPO_PATH}" \
                -d "$body")
              if [ "$http_code" = "200" ] || [ "$http_code" = "201" ]; then
                return 0
              fi
              sleep $((attempt * 2))
            done
            echo "::warning::gh_put_handoff_doc failed after 3 attempts (http=$http_code) -- batch handoff document not confirmed this cycle."
            return 1
          }

          DOC_HTTP=$(curl -s -o /tmp/handoff_doc_resp.json -w "%{http_code}" \
            -H "Authorization: token ${META_BOT_GITHUB_PAT}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY_OWNER}/${PRIVATE_REPO}/contents/${HANDOFF_REPO_PATH}")

          BATCH_T0=$(cat /tmp/batch_t0.txt)

          if [ "$DOC_HTTP" = "200" ]; then
            echo "Batch handoff document already exists -- leaving phase/ready_bots untouched, this cycle only refreshes expected_bots."
            python3 -c "
          import json, base64
          with open('/tmp/handoff_doc_resp.json') as f:
              d = json.load(f)
          content = base64.b64decode(d['content'].replace('\n', '')).decode()
          doc = json.loads(content)
          with open('/tmp/members.json') as mf:
              members = json.load(mf)
          doc['expected_bots'] = [m['bot_name'] for m in members]
          with open('/tmp/handoff_doc.json', 'w') as out:
              json.dump(doc, out, indent=2)
          "
          else
            echo "No batch handoff document yet -- forming a fresh one anchored to T0=${BATCH_T0}."
            python3 -c "
          import json
          with open('/tmp/members.json') as mf:
              members = json.load(mf)
          doc = {
              'batch_id': 'live-20260827052622-k672ed',
              't0': '${BATCH_T0}',
              'phase': 'idle',
              'primer_instance_id': None,
              'go_ts': None,
              'expected_bots': [m['bot_name'] for m in members],
              'ready_bots': [],
          }
          with open('/tmp/handoff_doc.json', 'w') as out:
              json.dump(doc, out, indent=2)
          "
          fi

          DOC_B64=$(base64 -w0 /tmp/handoff_doc.json)
          gh_put_handoff_doc "$DOC_B64" "meta-site: sync batch handoff document live-20260827052622-k672ed"

      - name: Primer mode wait
        if: env.HANDOFF_MODE == 'primer' && steps.members.outputs.member_count != '0'
        id: primer_mode
        run: |
          gh_get_handoff_doc() {
            curl -s -H "Authorization: token ${META_BOT_GITHUB_PAT}" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY_OWNER}/${PRIVATE_REPO}/contents/${HANDOFF_REPO_PATH}"
          }

          gh_put_handoff_doc() {
            local content_b64="$1"
            local message="$2"
            for attempt in 1 2 3; do
              sha=$(gh_get_handoff_doc | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get("sha","") if isinstance(d,dict) else "")' 2>/dev/null || echo "")
              if [ -n "$sha" ]; then
                body=$(python3 -c "import json,sys; print(json.dumps({'message': sys.argv[1], 'content': sys.argv[2], 'sha': sys.argv[3]}))" "$message" "$content_b64" "$sha")
              else
                body=$(python3 -c "import json,sys; print(json.dumps({'message': sys.argv[1], 'content': sys.argv[2]}))" "$message" "$content_b64")
              fi
              http_code=$(curl -s -o /tmp/primer_put_resp.json -w "%{http_code}" \
                -X PUT -H "Authorization: token ${META_BOT_GITHUB_PAT}" \
                -H "Accept: application/vnd.github.v3+json" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY_OWNER}/${PRIVATE_REPO}/contents/${HANDOFF_REPO_PATH}" \
                -d "$body")
              if [ "$http_code" = "200" ] || [ "$http_code" = "201" ]; then
                return 0
              fi
              sleep $((attempt * 2))
            done
            return 1
          }

          read_handoff_field() {
            gh_get_handoff_doc | python3 -c "import sys,json,base64; d=json.load(sys.stdin); h=json.loads(base64.b64decode(d['content']).decode()); print(h.get('$1','') or '')" 2>/dev/null || echo ""
          }

          write_handoff_phase_and_primer() {
            local phase="$1"
            local primer_id="$2"
            doc_resp=$(gh_get_handoff_doc)
            sha=$(echo "$doc_resp" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get("sha","") if isinstance(d,dict) else "")' 2>/dev/null || echo "")
            [ -z "$sha" ] && return 1
            updated_b64=$(echo "$doc_resp" | python3 -c "
          import sys, json, base64
          d = json.load(sys.stdin)
          content = base64.b64decode(d['content'].replace('\n', '')).decode()
          doc = json.loads(content)
          doc['phase'] = '$phase'
          doc['primer_instance_id'] = $([ -z "$primer_id" ] && echo 'None' || echo "'$primer_id'")
          print(base64.b64encode(json.dumps(doc, indent=2).encode()).decode())
          ")
            gh_put_handoff_doc "$updated_b64" "handoff: batch phase -> $phase"
          }

          THIS_INSTANCE_ID="${{ github.run_id }}-${{ github.run_attempt }}"

          existing_primer_id=$(read_handoff_field primer_instance_id)
          existing_phase=$(read_handoff_field phase)
          if [ -n "$existing_primer_id" ] && [ "$existing_primer_id" != "$THIS_INSTANCE_ID" ] && [ "$existing_phase" != "idle" ] && [ -n "$existing_phase" ]; then
            echo "Handoff slot already claimed by ${existing_primer_id} (phase=${existing_phase}) -- this primer is stale, exiting without serving."
            echo "got_go=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          write_handoff_phase_and_primer "ready" "$THIS_INSTANCE_ID"

          POLL_DEADLINE=$(( $(date +%s) + 20*60 ))
          got_go="false"
          while [ "$(date +%s)" -lt "$POLL_DEADLINE" ]; do
            cur_phase=$(read_handoff_field phase)
            cur_primer=$(read_handoff_field primer_instance_id)
            if [ "$cur_phase" = "go_sent" ] && [ "$cur_primer" = "$THIS_INSTANCE_ID" ]; then
              got_go="true"
              break
            fi
            if [ "$cur_phase" = "idle" ]; then
              echo "Handoff reset to idle while waiting -- outgoing process handled this cycle itself, exiting."
              break
            fi
            sleep 5
          done
          echo "got_go=$got_go" >> "$GITHUB_OUTPUT"

      - name: Restore member DB states
        if: steps.members.outputs.member_count != '0' && (env.HANDOFF_MODE != 'primer' || steps.primer_mode.outputs.got_go == 'true')
        run: |
          python3 -c "
          import json
          with open('/tmp/members.json') as f:
              members = json.load(f)
          for m in members:
              if m.get('bot_type', 'live') == 'live':
                  print(m['bot_name'])
          " > /tmp/member_names.txt

          while IFS= read -r BOT_NAME; do
            [ -z "$BOT_NAME" ] && continue
            BOT_DIR_REPO_PATH="freqtrade-core/user_data/live_bots/${BOT_NAME}"
            BOT_DB_PATH="${WORKING_DIR}/user_data/live_bots/${BOT_NAME}/tradesv3.sqlite"
            mkdir -p "$(dirname "$BOT_DB_PATH")"
            SNAPSHOT_HTTP=$(curl -s -o /tmp/db_snapshot_resp.json -w "%{http_code}" \
              -H "Authorization: token ${META_BOT_GITHUB_PAT}" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY_OWNER}/${PRIVATE_REPO}/contents/${BOT_DIR_REPO_PATH}/db_snapshot.sqlite.b64")
            if [ "$SNAPSHOT_HTTP" = "200" ]; then
              python3 -c "
          import json, base64
          with open('/tmp/db_snapshot_resp.json') as f:
              d = json.load(f)
          inner_b64 = base64.b64decode(d['content'].replace('\n', ''))
          decoded = base64.b64decode(inner_b64)
          with open('${BOT_DB_PATH}', 'wb') as out:
              out.write(decoded)
          "
              echo "DB restored for ${BOT_NAME} from private-repo snapshot."
            else
              echo "No snapshot for ${BOT_NAME} -- starting with a fresh DB."
            fi
          done < /tmp/member_names.txt

      - name: Launch member processes with memory guardrail
        if: steps.members.outputs.member_count != '0' && (env.HANDOFF_MODE != 'primer' || steps.primer_mode.outputs.got_go == 'true')
        id: run_members
        run: |
          # Pass 58: explicit, deliberate version marker -- printed as a
          # real command (not left as incidental comment text that only
          # shows up in the log because it happened to be the first
          # line of a run: block, which is how earlier "Pass N" comments
          # ended up visible here and caused confusion about which pass
          # was actually running). This line is the one thing to grep
          # for, or read at a glance, to know for certain which template
          # version dispatched this specific job run.
          echo "=== batch-template.yml TEMPLATE_VERSION=pass-62 ==="

          # Pass 54: extracted to scripts/parse_member_launch_list.py
          # (was an inline python3 -c). Logic unchanged, only where it
          # lives changed -- see the "Launch member processes" step's
          # own comment further down for why several blocks in this
          # step were pulled out.
          python3 "${WORKING_DIR}/scripts/parse_member_launch_list.py"

          TOKEN_ENV_ALIASES="BOT_TOKEN TELEGRAM_BOT_TOKEN TELEGRAM_TOKEN TITAN_BOT_TOKEN TG_TOKEN TG_BOT_TOKEN"
          CHAT_ID_ENV_ALIASES="CHAT_ID TELEGRAM_CHAT_ID TITAN_CHAT_ID TG_CHAT_ID"

          declare -A PIDS
          declare -A MEMLIMITS
          declare -A MEMBER_REPO_PATHS
          declare -A LAUNCH_CREDENTIALS_UPDATED_AT
          # Pass 52: separate from PIDS (freqtrade/bot.py's own PID) --
          # a 'live' member's tunnel sidecar is a second background
          # subshell with its own PID, only ever populated for 'live'
          # members whose tunnel attach actually started (see the
          # attach block above). Kept as its own map rather than
          # overloading PIDS so the main kill loop below can signal
          # both independently without either one's absence (e.g. a
          # custom_bot member, which has no tunnel sidecar at all)
          # causing a bad lookup.
          declare -A TUNNEL_PIDS
          TOTAL_MEM_MB=0
          PROBE_PORT_CHECKS=""

          while IFS='|' read -r BOT_NAME STRATEGY_CLASS MAX_MEM_MB BOT_TYPE ENTRY_PORT MEMBER_BOT_DIR; do
            [ -z "$BOT_NAME" ] && continue
            TOTAL_MEM_MB=$((TOTAL_MEM_MB + MAX_MEM_MB))
            if [ "$TOTAL_MEM_MB" -gt "$MAX_BATCH_MEM_MB" ]; then
              echo "::warning::batch live-20260827052622-k672ed projected memory ${TOTAL_MEM_MB}MB exceeds ${MAX_BATCH_MEM_MB}MB soft guardrail at member ${BOT_NAME} -- launching anyway (soft, not enforced by the runner), flag for rebalancing."
            fi

            if [ "$BOT_TYPE" = "live" ]; then
              BOT_DIR="user_data/live_bots/${BOT_NAME}"
              BOT_DIR_REPO_PATH="freqtrade-core/${BOT_DIR}"
              mkdir -p "${WORKING_DIR}/${BOT_DIR}"

              MEMBER_SECRETS_HTTP=$(curl -s -o "/tmp/secrets_${BOT_NAME}.json" -w "%{http_code}" \
                -H "Authorization: token ${META_BOT_GITHUB_PAT}" \
                -H "Accept: application/vnd.github.v3+json" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY_OWNER}/${PRIVATE_REPO}/contents/${BOT_DIR_REPO_PATH}/secrets.json")
              MEMBER_CONTROL_HTTP=$(curl -s -o "/tmp/control_${BOT_NAME}.json" -w "%{http_code}" \
                -H "Authorization: token ${META_BOT_GITHUB_PAT}" \
                -H "Accept: application/vnd.github.v3+json" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY_OWNER}/${PRIVATE_REPO}/contents/${BOT_DIR_REPO_PATH}/control.json")

              if [ "$MEMBER_SECRETS_HTTP" != "200" ] || [ "$MEMBER_CONTROL_HTTP" != "200" ]; then
                echo "::error::batch live-20260827052622-k672ed member ${BOT_NAME}: secrets.json or control.json missing (secrets=$MEMBER_SECRETS_HTTP, control=$MEMBER_CONTROL_HTTP) -- skipping this member this cycle rather than launching without credentials."
              else
                # Pass 54: extracted to scripts/build_member_config.py
                # (was two inline python3 -c blocks -- decode secrets/
                # control, then build config.json). Logic unchanged,
                # only where it lives changed; see that step's comment
                # for why this and two other blocks were pulled out of
                # this step. Reads secrets.json/control.json from disk
                # rather than taking them as args, so no key/secret/
                # password value ever appears in a process listing.
                python3 "${WORKING_DIR}/scripts/build_member_config.py" "${BOT_NAME}" "${ENTRY_PORT}" "${WORKING_DIR}/${BOT_DIR}/config.json"
                (cd "${WORKING_DIR}" && exec python3 -m freqtrade trade \
                  --config "${BOT_DIR}/config.json" \
                  --db-url "sqlite:///${BOT_DIR}/tradesv3.sqlite" \
                  --strategy "${STRATEGY_CLASS}") &
                PIDS["$BOT_NAME"]=$!
                MEMBER_REPO_PATHS["$BOT_NAME"]="$BOT_DIR_REPO_PATH"
                LAUNCH_CREDENTIALS_UPDATED_AT["$BOT_NAME"]=$(python3 -c "
          import json
          with open('/tmp/control_${BOT_NAME}_decoded.json') as f:
              print(json.load(f).get('credentials_updated_at') or '')
          " 2>/dev/null || echo "")

                # Pass 52: per-member Cloudflare Quick Tunnel for 'live'
                # batch members. Standalone live bots (bot-template.yml)
                # have always had this; batch members never did -- the
                # 'live' branch here launched freqtrade directly with no
                # tunnel step at all, so every batched live bot's FreqUI
                # was permanently unreachable regardless of freqtrade's
                # own health. Every path/port that would collide across
                # N members sharing one runner is namespaced by BOT_NAME
                # (tunnel_manager.py does this itself now -- see its
                # cf_log_path/cf_pid_path construction).
                #
                # Pass 58: replaces scripts/attach_tunnel.sh (the pass-54
                # extraction of what was pass-52's inline subshell) with
                # the same shared scripts/tunnel_manager.py that
                # bot-template.yml now uses -- see that module's docstring
                # for the full rationale. attach_tunnel.sh no longer
                # exists; this is the one tunnel implementation for every
                # 'live' bot in the codebase, standalone or batched.
                # TUNNEL_WATCH_PID is this member's own freqtrade PID
                # (${PIDS[$BOT_NAME]}, just assigned above), so the
                # manager exits with this specific member, not the whole
                # batch. TUNNEL_CONTROL_REPO_PATH is intentionally left
                # UNSET here (batch members have no per-member control.json
                # force_tunnel_retry concept, matching pre-pass-58 behavior
                # where attach_tunnel.sh never had a retry poll at all --
                # only bot-template.yml's standalone live bots did).
                # TUNNEL_LOG_PREFIX includes the batch ID so a batch run's
                # single interleaved log stream stays attributable per
                # member at a glance, not just per bot name.
                TUNNEL_LOCAL_PORT="${ENTRY_PORT}" \
                TUNNEL_STATUS_REPO_PATH="${BOT_DIR_REPO_PATH}/tunnel.json" \
                TUNNEL_STATUS_BOT_NAME="${BOT_NAME}" \
                TUNNEL_STATUS_GITHUB_PAT="${META_BOT_GITHUB_PAT}" \
                TUNNEL_STATUS_GITHUB_OWNER="${GITHUB_REPOSITORY_OWNER}" \
                TUNNEL_STATUS_PRIVATE_REPO="${PRIVATE_REPO}" \
                TUNNEL_WATCH_PID="${PIDS[$BOT_NAME]}" \
                TUNNEL_LOG_PREFIX="live-20260827052622-k672ed/${BOT_NAME}" \
                python3 "${WORKING_DIR}/scripts/tunnel_manager.py" run > "/tmp/tunnel_manager_${BOT_NAME}.log" 2>&1 &
                TUNNEL_PIDS["$BOT_NAME"]=$!
              fi
            else
              MEMBER_ABS_DIR="${WORKING_DIR}/${MEMBER_BOT_DIR#freqtrade-core/}"
              MEMBER_REPO_PATHS["$BOT_NAME"]="$MEMBER_BOT_DIR"
              LAUNCH_CREDENTIALS_UPDATED_AT["$BOT_NAME"]=""
              if [ -f "${MEMBER_ABS_DIR}/control.json" ]; then
                LAUNCH_CREDENTIALS_UPDATED_AT["$BOT_NAME"]=$(python3 -c "
          import json
          try:
              with open('${MEMBER_ABS_DIR}/control.json') as f:
                  print(json.load(f).get('credentials_updated_at') or '')
          except FileNotFoundError:
              print('')
          " 2>/dev/null || echo "")
              fi
              (
                cd "${MEMBER_ABS_DIR}" || exit 1
                if [ -f requirements.txt ]; then
                  pip install -r requirements.txt --quiet
                fi

                if [ -f bot_token.txt ]; then
                  TOKEN_VALUE=$(cat bot_token.txt)
                  for ALIAS in $TOKEN_ENV_ALIASES; do
                    export "$ALIAS=$TOKEN_VALUE"
                  done
                fi
                if [ -f chat_id.txt ]; then
                  CHAT_ID_VALUE=$(cat chat_id.txt)
                  for ALIAS in $CHAT_ID_ENV_ALIASES; do
                    export "$ALIAS=$CHAT_ID_VALUE"
                  done
                fi
                if [ -f extra_credentials.json ]; then
                  EXTRA_EXPORTS_FILE=$(mktemp)
                  python3 -c "
          import json
          import sys

          with open('extra_credentials.json') as f:
              entries = json.load(f)
          with open('$EXTRA_EXPORTS_FILE', 'w') as out:
              for e in entries:
                  label = e.get('label', '')
                  value = e.get('value', '')
                  if label:
                      safe_label = label.replace(chr(39), '')
                      safe_value = value.replace(chr(39), chr(39) + chr(92) + chr(39) + chr(39))
                      out.write('export ' + safe_label + \"='\" + safe_value + \"'\n\")
          "
                  . "$EXTRA_EXPORTS_FILE"
                  rm -f "$EXTRA_EXPORTS_FILE"
                fi
                export ENTRY_PORT="${ENTRY_PORT}"

                # Coordinates for an optional self-published tunnel status.
                # If bot.py runs its own tunnel (e.g. a cloudflared subprocess
                # wrapping a local API server on ENTRY_PORT), it can PUT
                # {"tunnel_url": ..., "bot_name": ...} to this repo path via
                # the GitHub Contents API using these credentials, so the
                # meta-site's custom-bot detail page can discover and render
                # it exactly like it does for standalone live bots'
                # tunnel.json. Nothing requires bot.py to use this -- a bot
                # that doesn't run a tunnel can ignore these entirely.
                export TUNNEL_STATUS_REPO_PATH="${MEMBER_BOT_DIR}/tunnel.json"
                export TUNNEL_STATUS_BOT_NAME="${BOT_NAME}"
                export TUNNEL_STATUS_GITHUB_PAT="${META_BOT_GITHUB_PAT}"
                export TUNNEL_STATUS_GITHUB_OWNER="${GITHUB_REPOSITORY_OWNER}"
                export TUNNEL_STATUS_PRIVATE_REPO="${PRIVATE_REPO}"

                exec python3 bot.py
              ) &
              PIDS["$BOT_NAME"]=$!
              if [ -n "$ENTRY_PORT" ]; then
                if [ -n "$PROBE_PORT_CHECKS" ]; then
                  PROBE_PORT_CHECKS="${PROBE_PORT_CHECKS},"
                fi
                PROBE_PORT_CHECKS="${PROBE_PORT_CHECKS}${BOT_NAME}:${ENTRY_PORT}"
              fi
            fi
            MEMLIMITS["$BOT_NAME"]="$MAX_MEM_MB"
          done < /tmp/member_launch.txt

          echo "Batch live-20260827052622-k672ed launched ${#PIDS[@]} member process(es), projected ${TOTAL_MEM_MB}MB against a ${MAX_BATCH_MEM_MB}MB soft guardrail."

          PROBE_TRACKED_PIDS=""
          for BOT_NAME in "${!PIDS[@]}"; do
            if [ -n "$PROBE_TRACKED_PIDS" ]; then
              PROBE_TRACKED_PIDS="${PROBE_TRACKED_PIDS},"
            fi
            PROBE_TRACKED_PIDS="${PROBE_TRACKED_PIDS}${BOT_NAME}:${PIDS[$BOT_NAME]}"
          done

          PROBE_TRACKED_PIDS="${PROBE_TRACKED_PIDS}" \
          PROBE_PORT_CHECKS="${PROBE_PORT_CHECKS}" \
          PROBE_RUNNER_ID="batch-live-20260827052622-k672ed" \
          PROBE_POOL="live" \
          PROBE_STATUS_PATH="freqtrade-core/user_data/probes/batch-live-20260827052622-k672ed.json" \
          META_BOT_GITHUB_PAT="${META_BOT_GITHUB_PAT}" \
          META_BOT_GITHUB_OWNER="${GITHUB_REPOSITORY_OWNER}" \
          META_BOT_PRIVATE_REPO_NAME="${PRIVATE_REPO}" \
          nohup python3 "${WORKING_DIR}/scripts/ram_probe.py" loop > /tmp/ram_probe.log 2>&1 &
          PROBE_PID=$!

          STOP_AFTER_SECONDS=$((5*3600 + 50*60))
          END_TIME=$(( $(date +%s) + STOP_AFTER_SECONDS ))
          HANDOFF_MARGIN_SECONDS=$((15*60))
          HANDOFF_REPO_PATH="freqtrade-core/user_data/batches/live-20260827052622-k672ed/handoff.json"

          # Pass 54: extracted to scripts/mark_bot_ready.sh (was the
          # mark_bot_ready_in_handoff shell function, defined and
          # sourced inline). Logic unchanged, only where it lives
          # changed -- see the tunnel-attach step's comment above for
          # why. Called below as a plain script rather than a sourced
          # function; MARKED_READY bookkeeping (which member has
          # already been marked) still lives here since it's specific
          # to this loop, not to the marking logic itself.
          mark_bot_ready_in_handoff() {
            local bot_name="$1"
            META_BOT_GITHUB_PAT="${META_BOT_GITHUB_PAT}" \
            GITHUB_REPOSITORY_OWNER="${GITHUB_REPOSITORY_OWNER}" \
            PRIVATE_REPO="${PRIVATE_REPO}" \
            bash "${WORKING_DIR}/scripts/mark_bot_ready.sh" "$bot_name" "$HANDOFF_REPO_PATH"
          }

          declare -A MARKED_READY
          PRIMER_DISPATCHED="false"
          EXIT_SENTINEL=""

          while [ "$(date +%s)" -lt "$END_TIME" ]; do
            sleep 300
            for BOT_NAME in "${!PIDS[@]}"; do
              PID="${PIDS[$BOT_NAME]}"
              if ! kill -0 "$PID" 2>/dev/null; then
                echo "::warning::member ${BOT_NAME} (pid ${PID}) exited unexpectedly mid-batch -- not relaunched this cycle."
                unset PIDS["$BOT_NAME"]
              fi
            done
            if [ "${#PIDS[@]}" -eq 0 ]; then
              echo "All member processes have exited -- ending batch cycle early."
              break
            fi

            _any_credentials_changed="false"
            for BOT_NAME in "${!PIDS[@]}"; do
              MEMBER_REPO_PATH="${MEMBER_REPO_PATHS[$BOT_NAME]:-}"
              [ -z "$MEMBER_REPO_PATH" ] && continue
              MEMBER_CUR_CREDENTIALS_UPDATED_AT=$(curl -s \
                -H "Authorization: token ${META_BOT_GITHUB_PAT}" \
                -H "Accept: application/vnd.github.v3+json" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY_OWNER}/${PRIVATE_REPO}/contents/${MEMBER_REPO_PATH}/control.json" \
                | python3 -c "import sys,json,base64; d=json.load(sys.stdin); print(json.loads(base64.b64decode(d['content']).decode()).get('credentials_updated_at') or '')" 2>/dev/null || echo "")
              MEMBER_LAUNCH_VALUE="${LAUNCH_CREDENTIALS_UPDATED_AT[$BOT_NAME]:-}"
              if [ -n "$MEMBER_CUR_CREDENTIALS_UPDATED_AT" ] && [ "$MEMBER_CUR_CREDENTIALS_UPDATED_AT" != "$MEMBER_LAUNCH_VALUE" ]; then
                echo "member ${BOT_NAME}: credentials_updated_at changed (${MEMBER_LAUNCH_VALUE} -> ${MEMBER_CUR_CREDENTIALS_UPDATED_AT}) -- requesting whole-batch graceful handoff."
                _any_credentials_changed="true"
              fi
            done

            _time_left=$(( END_TIME - $(date +%s) ))
            if [ "$_any_credentials_changed" = "true" ] && [ "$_time_left" -gt "$HANDOFF_MARGIN_SECONDS" ]; then
              _time_left="$HANDOFF_MARGIN_SECONDS"
            fi
            if [ "$_time_left" -le "$HANDOFF_MARGIN_SECONDS" ]; then
              for BOT_NAME in "${!PIDS[@]}"; do
                if [ -z "${MARKED_READY[$BOT_NAME]:-}" ]; then
                  mark_bot_ready_in_handoff "$BOT_NAME" && MARKED_READY["$BOT_NAME"]=1
                fi
              done

              ALL_READY=$(curl -s -H "Authorization: token ${META_BOT_GITHUB_PAT}" \
                -H "Accept: application/vnd.github.v3+json" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY_OWNER}/${PRIVATE_REPO}/contents/${HANDOFF_REPO_PATH}" \
                | python3 -c "
          import sys, json, base64
          d = json.load(sys.stdin)
          content = base64.b64decode(d['content'].replace('\n', '')).decode()
          doc = json.loads(content)
          expected = set(doc.get('expected_bots', []))
          ready = set(e['bot_name'] for e in doc.get('ready_bots', []))
          print('true' if expected and expected.issubset(ready) else 'false')
          " 2>/dev/null || echo "false")

              if [ "$ALL_READY" = "true" ] && [ "$PRIMER_DISPATCHED" = "false" ]; then
                echo "All expected bots ready -- dispatching primer for batch live-20260827052622-k672ed."
                curl -s -X POST \
                  -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                  -H "Accept: application/vnd.github.v3+json" \
                  "https://api.github.com/repos/${{ github.repository }}/dispatches" \
                  -d "{\"event_type\":\"prime-batch-live-20260827052622-k672ed\"}" > /dev/null
                PRIMER_DISPATCHED="true"
              fi

              if [ "$PRIMER_DISPATCHED" = "true" ]; then
                cur_phase=$(curl -s -H "Authorization: token ${META_BOT_GITHUB_PAT}" \
                  -H "Accept: application/vnd.github.v3+json" \
                  "https://api.github.com/repos/${GITHUB_REPOSITORY_OWNER}/${PRIVATE_REPO}/contents/${HANDOFF_REPO_PATH}" \
                  | python3 -c "import sys,json,base64; d=json.load(sys.stdin); h=json.loads(base64.b64decode(d['content']).decode()); print(h.get('phase','') or '')" 2>/dev/null || echo "")
                cur_primer=$(curl -s -H "Authorization: token ${META_BOT_GITHUB_PAT}" \
                  -H "Accept: application/vnd.github.v3+json" \
                  "https://api.github.com/repos/${GITHUB_REPOSITORY_OWNER}/${PRIVATE_REPO}/contents/${HANDOFF_REPO_PATH}" \
                  | python3 -c "import sys,json,base64; d=json.load(sys.stdin); h=json.loads(base64.b64decode(d['content']).decode()); print(h.get('primer_instance_id','') or '')" 2>/dev/null || echo "")
                if [ "$cur_phase" = "ready" ] && [ -n "$cur_primer" ]; then
                  echo "Primer ${cur_primer} is ready -- yielding batch live-20260827052622-k672ed now."
                  doc_resp=$(curl -s -H "Authorization: token ${META_BOT_GITHUB_PAT}" \
                    -H "Accept: application/vnd.github.v3+json" \
                    "https://api.github.com/repos/${GITHUB_REPOSITORY_OWNER}/${PRIVATE_REPO}/contents/${HANDOFF_REPO_PATH}")
                  sha=$(echo "$doc_resp" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get("sha","") if isinstance(d,dict) else "")' 2>/dev/null || echo "")
                  if [ -n "$sha" ]; then
                    updated_b64=$(echo "$doc_resp" | python3 -c "
          import sys, json, base64
          d = json.load(sys.stdin)
          content = base64.b64decode(d['content'].replace('\n', '')).decode()
          doc = json.loads(content)
          doc['phase'] = 'go_sent'
          doc['go_ts'] = '$(date -u +%Y-%m-%dT%H:%M:%SZ)'
          print(base64.b64encode(json.dumps(doc, indent=2).encode()).decode())
          ")
                    body=$(python3 -c "import json,sys; print(json.dumps({'message': sys.argv[1], 'content': sys.argv[2], 'sha': sys.argv[3]}))" "handoff: go_sent for batch live-20260827052622-k672ed" "$updated_b64" "$sha")
                    curl -s -X PUT \
                      -H "Authorization: token ${META_BOT_GITHUB_PAT}" \
                      -H "Accept: application/vnd.github.v3+json" \
                      "https://api.github.com/repos/${GITHUB_REPOSITORY_OWNER}/${PRIVATE_REPO}/contents/${HANDOFF_REPO_PATH}" \
                      -d "$body" > /dev/null
                  fi
                  EXIT_SENTINEL="handoff_yielded"
                  break
                fi
              fi
            fi
          done

          for BOT_NAME in "${!PIDS[@]}"; do
            kill "${PIDS[$BOT_NAME]}" 2>/dev/null || true
            wait "${PIDS[$BOT_NAME]}" 2>/dev/null || true
          done
          # Pass 52: detach every member's own Cloudflare Quick Tunnel
          # (see TUNNEL_PIDS's own declaration comment). Pass 58: the
          # killed PID is now tunnel_manager.py itself (not a bash
          # subshell) -- `kill` sends SIGTERM, which its own signal
          # handler catches to kill its cloudflared child cleanly before
          # exiting (see tunnel_manager.py's attach_and_hold cleanup
          # path). The pidfile kill just below is a belt-and-suspenders
          # backstop, same reasoning as bot-template.yml's own backstop
          # Detach step, for the case where this kill races the process
          # dying on its own from PIDS[$BOT_NAME] exiting first.
          for BOT_NAME in "${!TUNNEL_PIDS[@]}"; do
            kill "${TUNNEL_PIDS[$BOT_NAME]}" 2>/dev/null || true
            if [ -f "/tmp/cloudflared_${BOT_NAME}.pid" ]; then
              kill "$(cat "/tmp/cloudflared_${BOT_NAME}.pid")" 2>/dev/null || true
            fi
          done
          kill "$PROBE_PID" 2>/dev/null || true

          echo "$EXIT_SENTINEL" > /tmp/exit_sentinel.txt

      - name: Upload member DB snapshots
        if: always() && steps.members.outputs.member_count != '0' && (env.HANDOFF_MODE != 'primer' || steps.primer_mode.outputs.got_go == 'true')
        run: |
          while IFS= read -r BOT_NAME; do
            [ -z "$BOT_NAME" ] && continue
            BOT_DB_PATH="${WORKING_DIR}/user_data/live_bots/${BOT_NAME}/tradesv3.sqlite"
            BOT_DIR_REPO_PATH="freqtrade-core/user_data/live_bots/${BOT_NAME}"
            if [ -f "$BOT_DB_PATH" ]; then
              B64=$(base64 -w0 "$BOT_DB_PATH")
              DOUBLE_B64=$(printf '%s' "$B64" | base64 -w0)
              SHA=$(curl -s -H "Authorization: token ${META_BOT_GITHUB_PAT}" \
                -H "Accept: application/vnd.github.v3+json" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY_OWNER}/${PRIVATE_REPO}/contents/${BOT_DIR_REPO_PATH}/db_snapshot.sqlite.b64" \
                | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get("sha","") if isinstance(d,dict) else "")' 2>/dev/null || echo "")
              if [ -n "$SHA" ]; then
                BODY=$(python3 -c "import json,sys; print(json.dumps({'message': 'db snapshot: update', 'content': sys.argv[1], 'sha': sys.argv[2]}))" "$DOUBLE_B64" "$SHA")
              else
                BODY=$(python3 -c "import json,sys; print(json.dumps({'message': 'db snapshot: create', 'content': sys.argv[1]}))" "$DOUBLE_B64")
              fi
              curl -s -X PUT \
                -H "Authorization: token ${META_BOT_GITHUB_PAT}" \
                -H "Accept: application/vnd.github.v3+json" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY_OWNER}/${PRIVATE_REPO}/contents/${BOT_DIR_REPO_PATH}/db_snapshot.sqlite.b64" \
                -d "$BODY"
            fi
          done < /tmp/member_names.txt

      - name: Schedule next run
        if: always() && steps.members.outputs.member_count != '0' && (env.HANDOFF_MODE != 'primer' || steps.primer_mode.outputs.got_go == 'true')
        run: |
          EXIT_SENTINEL=$(cat /tmp/exit_sentinel.txt 2>/dev/null || echo "")
          if [ "$EXIT_SENTINEL" = "handoff_yielded" ]; then
            echo "Clean handoff detected -- successor is already live under the '-primer' concurrency group. Skipping self-dispatch entirely."
            exit 0
          fi

          # Re-pull the private repo for consistency with the other two
          # templates' restart-authority checks (see bot-template.yml).
          # NOTE (scope): unlike bot-template.yml and wfo-bot-template.yml,
          # this step has no per-member paused/meta_restart check to
          # protect -- the batch template always self-dispatches on any
          # non-clean exit regardless of any individual member's
          # control.json. Adding that check is a real, related gap
          # (batch-level restarts currently have no Meta-Site override
          # at all) but is a distinct scope expansion beyond "the missing
          # git pull" and has not been added here.
          (
            cd "${WORKING_DIR}/.." && \
            source freqtrade-core/scripts/git_conflict_safety.sh && \
            git_safe_pull_rebase
          ) || echo "Warning: safe-pull before restart-authority check failed -- proceeding with local state as a best effort."

          echo "No claim found -- self-dispatching as fallback."
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/dispatches \
            -d '{"event_type":"restart-batch-live-20260827052622-k672ed"}'
